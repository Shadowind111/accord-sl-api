services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: accord
      POSTGRES_PASSWORD: accord
      POSTGRES_DB: accord
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accord -d accord"]
      interval: 5s
      timeout: 5s
      retries: 12

  accord-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ACCORD_API_KEY: "${ACCORD_API_KEY:-change-me-in-production}"
      ACCORD_AUDIT_LOG: "/data/audit.jsonl"
      ACCORD_DATABASE_URL: "postgresql://accord:accord@db:5432/accord"
      ACCORD_CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
